# Herdr plugin manifest: https://herdr.dev/tui/docs/plugins/
#
# `herdr plugin install ahmerb/herdr-gemini-cli` clones this repo, runs the
# [[build]] step below (which installs the Gemini CLI extension from the same
# checkout), and registers the plugin. dist/ is committed, so no npm build runs
# at install time.

id = "herdr-gemini-cli"
name = "Herdr Gemini CLI"
version = "0.1.0"
description = "Gemini CLI integration: live pane state (working, blocked, idle), session resume, and Gemini actions."
min_herdr_version = "0.9.5"
platforms = ["linux", "macos"]

# Installs (or reinstalls) the Gemini CLI extension, and records the absolute
# node/gemini paths so plugin actions work even when they are not on the Herdr
# server's PATH. Requires `gemini` and `node` on PATH.
[[build]]
command = ["sh", "plugin/install-extension.sh"]

# Node-based actions and panes start through the launcher:
#   command = ["sh", "plugin/node.sh", "dist/plugin/commands/<name>.js"]

# Resets a Gemini pane stuck on `blocked` (e.g. after a denied or cancelled
# tool permission prompt, which fires no Gemini hook) back to `idle`.
[[actions]]
id = "clear-blocked"
title = "Gemini: clear blocked state"
contexts = ["pane"]
command = ["sh", "plugin/node.sh", "dist/plugin/commands/clear-blocked.js"]

# Splits the focused pane to the right (same directory), focuses it, and starts
# `gemini` in its shell.
[[actions]]
id = "new-pane"
title = "Gemini: new pane"
contexts = ["pane"]
command = ["sh", "plugin/new-pane.sh"]

# Reinstall / remove the Gemini CLI extension (#8). Each action opens a popup
# that runs the script and waits for Enter, since action output only reaches
# the plugin log.
[[panes]]
id = "reinstall-extension"
title = "Gemini: reinstall extension"
placement = "popup"
width = "80%"
height = "60%"
command = ["sh", "plugin/run-in-popup.sh", "plugin/reinstall-extension.sh"]

[[panes]]
id = "remove-extension"
title = "Gemini: remove extension"
placement = "popup"
width = "80%"
height = "60%"
command = ["sh", "plugin/run-in-popup.sh", "plugin/remove-extension.sh"]

[[actions]]
id = "reinstall-extension"
title = "Gemini: reinstall extension"
command = ["sh", "plugin/open-popup.sh", "reinstall-extension"]

[[actions]]
id = "remove-extension"
title = "Gemini: remove extension"
command = ["sh", "plugin/open-popup.sh", "remove-extension"]

# "Gemini: doctor": a popup that checks Herdr, node, gemini, the Gemini
# extension and the socket. The action just opens the popup entrypoint.
[[panes]]
id = "doctor"
title = "Gemini doctor"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "plugin/node.sh", "dist/plugin/commands/doctor.js"]

[[actions]]
id = "doctor"
title = "Gemini: doctor"
contexts = ["pane"]
command = ["sh", "plugin/open-popup.sh", "doctor"]
